name: publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ./Cleaning-Service.sln.sln

      - name: Build
        run: dotnet build ./Cleaning-Service.sln.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./Cleaning-Service.sln.sln --configuration Release --no-build
